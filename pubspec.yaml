name: transit_monkey
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  archive: ^3.4.10
  clippy_flutter: ^2.0.0-nullsafety.1
  collection: ^1.18.0
  csv: ^5.1.1
  custom_info_window: ^1.0.1
  fixnum: ^1.1.0
  flutter:
    sdk: flutter
  flutter_spinkit: ^5.2.0
  geocoding: ^2.1.1
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3
  http: ^1.2.0
  lints: ^2.1.1
  path: ^1.8.3
  path_provider: ^2.1.2
  protobuf: ^3.1.0
  sqflite: ^2.3.2
  tuple: ^2.0.2
  widget_to_marker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.0

flutter_launcher_icons:
  android: true
  ios: true
  addaptive_icon_foreground: "assets/imgs/icons/foreground_icon.png"
  adaptive_icon_background: "assets/imgs/icons/background_icon.png"
  image_path_android: "assets/imgs/icons/android_icon.png"
  image_path_ios: "assets/imgs/icons/apple_icon.png"





flutter:
  uses-material-design: true
  assets:
    - assets/json/
    - assets/imgs/
